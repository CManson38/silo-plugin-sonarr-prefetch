name: Build, test and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  GOWORK: 'off'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Reject local dependency replacements
        run: go mod edit -json | python3 -c 'import json, sys; local = [r for r in (json.load(sys.stdin).get("Replace") or []) if not r["New"].get("Version")]; assert not local, "go.mod must not contain local dependency replacements"'
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l main.go main_test.go prefetch cmd)"
      - run: go build -o plugin . && ./plugin manifest > /tmp/prefetch-manifest.json
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 -c 'import json, os; assert os.environ["GITHUB_REF_NAME"] == "v" + json.load(open("manifest.json"))["version"], "Release tag must match manifest.json"'
      - run: python3 scripts/build.py
      - run: python3 scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: prefetch-plugins
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/plugin-*
            dist/manifest-*.json
            dist/checksums.txt
            dist/index.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prefetch-plugins
          path: dist
      - name: Verify release checksums
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          sha256sum --check checksums.txt
      - name: Verify release metadata and archives
        run: python3 scripts/check_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS dist/plugin-* dist/manifest-*.json dist/checksums.txt dist/index.json --verify-tag --title "Prefetch ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
      - name: Notify approved community catalog
        env:
          DISPATCH_TOKEN: ${{ secrets.SILO_PLUGINS_DISPATCH_TOKEN }}
          PLUGIN_REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "SILO_PLUGINS_DISPATCH_TOKEN is not set; skipping catalog dispatch."
            exit 0
          fi
          jq -n --arg repo "$PLUGIN_REPO" --arg tag "$GITHUB_REF_NAME" \
            '{event_type: "plugin_release_published", client_payload: {repo: $repo, tag: $tag}}' > /tmp/prefetch-dispatch.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Silo-Community/silo-plugins/dispatches \
            --data-binary @/tmp/prefetch-dispatch.json
      - name: Update repository catalog
        run: |
          git fetch origin main
          git switch -c publish-catalog origin/main
          cp dist/index.json index.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update plugin catalog for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
