name: Build, test and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l main.go prefetch)"
      - run: go build -o plugin . && ./plugin manifest > /tmp/prefetch-manifest.json
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 -c 'import json, os; assert os.environ["GITHUB_REF_NAME"] == "v" + json.load(open("manifest.json"))["version"], "Release tag must match manifest.json"'
      - run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: prefetch-plugins
          path: |
            dist/*.zip
            dist/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prefetch-plugins
          path: dist
      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --verify-tag --title "Prefetch ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
